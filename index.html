<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<title>Jadwal Sholat</title>

</head>
<body class="dark">
  
<h2>Jadwal Sholat</h2>
<div class="info" id="lokasi"></div>
<div class="info" id="tanggal"></div>
<div class="info" id="hijriyah"></div>
<div class="clock" id="clock"></div>

<div id="jadwal"></div>
<div class="countdown" id="countdown"></div>
<div id="notifAlert" class="d-none alert alert-success text-center mt-3" role="alert">
  Notification: <span id="cek"></span>
</div>

<div class="end p-2">
  <label for="checkbox" id="activation">Aktifkan Adzan</label>
  <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" id="checkbox">
</div>
</div>

<div class="footer">
  <footer>
      <div class="copy">
        <span>Copyright &copy; RizWebs <span id="tahun"></span>.</span>
      </div>
    <span>v 1.0.0</span>
  </footer>
</div>

<audio id="adzan" src="adzan.mp3"></audio>
<audio id="adzanSubuh" src="adzan-subuh.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
